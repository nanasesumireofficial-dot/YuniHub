<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YuniHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dragbar"></div>
  <div id="app"></div>
  <div id="splash" class="splash-shell" aria-live="polite">
    <div class="splash-glow"></div>
    <div class="splash-card loading-card">
      <div class="splash-logo">Y</div>
      <div class="splash-copy">
        <span class="splash-kicker">Welcome</span>
        <h1>YuniHub</h1>
        <p>Preparing your workspace.</p>
      </div>
    </div>
  </div>
  <div id="palette"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
