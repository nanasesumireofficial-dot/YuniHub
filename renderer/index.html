<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YuniHub</title>
  <link rel="icon" type="image/svg+xml" href="../build/yunihub-icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dragbar"></div>
  <div id="app"></div>
  <div id="splash" class="splash-shell" aria-live="polite">
    <div class="splash-glow"></div>
    <div class="splash-card loading-card">
      <img class="splash-wordmark" src="../yunihub-logo-wordmark.svg" alt="YuniHub" />
      <span class="splash-loading">Welcome To My Hub ❤️ </span>
    </div>
  </div>
  <div id="palette"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="generated/app.js"></script>
</body>
</html>
